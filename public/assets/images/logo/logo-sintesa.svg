<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="200" height="200">
  <defs>
    <linearGradient id="grad-border" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B5BDB"/>
      <stop offset="100%" stop-color="#0EB78F"/>
    </linearGradient>
    <linearGradient id="grad-s" x1="100" y1="44" x2="100" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B5BDB"/>
      <stop offset="100%" stop-color="#0EB78F"/>
    </linearGradient>
  </defs>

  <!-- Outer squircle: gradient border, white fill -->
  <rect x="9" y="9" width="182" height="182" rx="50"
        fill="white" stroke="url(#grad-border)" stroke-width="17"/>

  <!-- S letter path — 3 horizontal bars, 2 curved connectors -->
  <path d="M140,52 L61,52 Q43,52 43,70 L43,82 Q43,100 61,100 L140,100 Q158,100 158,118 L158,130 Q158,148 140,148 L61,148"
        stroke="url(#grad-s)" stroke-width="24" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blue dot — top-right endpoint -->
  <circle cx="140" cy="52" r="20" fill="#4054DC"/>

  <!-- Green dot — bottom-left endpoint -->
  <circle cx="61" cy="148" r="20" fill="#0DC99A"/>
</svg>
