      pointer-events: none;

    .page {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
      text-align: center;
      gap: 0;
    }
    .code {
      font-family: var(--mono);
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      margin-bottom: 0.15em;
    }
    .label {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-family: var(--mono);
      color: var(--cyan);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 1.6rem;
      opacity: 0.8;
    }
    h1 {
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 600;
      color: var(--t1);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    p {
      color: var(--t2);
      font-size: 1rem;
      max-width: 440px;
      line-height: 1.7;
      margin-bottom: 2.4rem;
    }
    .actions {
      display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--blue);
      color: #fff;
      border: none; border-radius: 100px;
      padding: 13px 28px;
      font-size: 0.95rem; font-weight: 600; font-family: var(--sans);
      cursor: pointer; text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
      box-shadow: 0 4px 18px rgba(61,135,203,0.35);
    }
    .btn-primary:hover {
      background: #2f71b0;
      box-shadow: 0 6px 24px rgba(61,135,203,0.55);
      transform: translateY(-1px);
    }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent;
      color: var(--t2);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 13px 28px;
      font-size: 0.95rem; font-weight: 500; font-family: var(--sans);
      cursor: pointer; text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); }
    .mascot-wrap {
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    .mascot-svg { width: 72px; height: auto; }
    .glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(61,135,203,0.07), transparent);
    }
    @media (prefers-reduced-motion: no-preference) {
      .mascot-svg { animation: float404 3.6s ease-in-out infinite; }
      @keyframes float404 {
        0%,100% { transform: translateY(0); }
        50%      { transform: translateY(-8px); }

    }
    @media (max-width: 480px) {
      .actions { flex-direction: column; align-items: center; }
